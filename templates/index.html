<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediBot - Your Health Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styling.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="medical-cross cross-1"></div>
        <div class="medical-cross cross-2"></div>
        <div class="medical-cross cross-3"></div>
        <div class="pulse-circle circle-1"></div>
        <div class="pulse-circle circle-2"></div>
        <div class="pulse-circle circle-3"></div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-user-md"></i>
                <h1>MediBot</h1>
            </div>
            <div class="status">
                <div class="status-indicator online"></div>
                <span>Online</span>
            </div>
        </div>
    </header>

    <!-- Main Chat Container -->
    <main class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <!-- Welcome Message -->
            <div class="message-wrapper bot-wrapper">
                <div class="avatar bot-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="message bot-message">
                    <div class="message-content">
                        <p>👋 Hello! I'm MediBot, your AI health assistant. How can I help you today?</p>
                        <div class="message-time">Just now</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Input -->
        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <!-- Language Dropdown -->
                <select id="languageSelect">
                    <option value="en">English</option>
                    <option value="hi">Hindi</option>
                </select>

                <!-- Hidden file input -->
                <input type="file" id="imageInput" accept="image/*" style="display: none;">

                <!-- Image Upload Button -->
                <button class="upload-btn" id="uploadBtn" title="Upload lab report image">
                    <i class="fas fa-image"></i>
                </button>

                <input type="text" id="messageInput" placeholder="Type your health question here..." autocomplete="off">

                <button class="voice-btn" title="Voice input">
                    <i class="fas fa-microphone"></i>
                </button>

                <button class="send-btn" id="sendBtn" title="Send message">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        class MedicalChatbot {
            constructor() {
                this.messageInput = document.getElementById('messageInput');
                this.sendBtn = document.getElementById('sendBtn');
                this.chatMessages = document.getElementById('chatMessages');
                this.voiceBtn = document.querySelector('.voice-btn');
                this.languageSelect = document.getElementById('languageSelect');
                this.uploadBtn = document.getElementById('uploadBtn');
                this.imageInput = document.getElementById('imageInput');
                this.initEventListeners();
                this.initVoiceRecognition();
            }

            initEventListeners() {
                this.sendBtn.addEventListener('click', () => this.handleInput());
                this.messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.handleInput();
                });
                this.voiceBtn.addEventListener('click', () => this.startVoiceInput());

                // Image upload handlers
                this.uploadBtn.addEventListener('click', () => this.imageInput.click());
                this.imageInput.addEventListener('change', (e) => this.handleImageUpload(e));
            }

            // ✅ Translation helper (can be used for both directions)
            async translateText(text, fromLang, toLang) {
                if (fromLang === toLang) return text;

                // Skip translation for long texts (MyMemory API limit is 500 chars)
                if (text.length > 400) {
                    console.warn("Text too long for translation API, sending untranslated");
                    return text;
                }

                try {
                    let translated = await fetch(
                        `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${fromLang}|${toLang}`
                    ).then(res => res.json());
                    return translated.responseData.translatedText || text;
                } catch (e) {
                    console.error("Translation error:", e);
                    return text;
                }
            }

            initVoiceRecognition() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    console.error("SpeechRecognition not supported in this browser.");
                    return;
                }

                this.recognition = new SpeechRecognition();
                this.recognition.continuous = true;
                this.recognition.interimResults = false;

                this.recognition.onresult = async (event) => {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            transcript += event.results[i][0].transcript;
                        }
                    }

                    if (!transcript) return;

                    let lang = this.languageSelect.value;
                    let finalText = lang === "hi"
                        ? await this.translateText(transcript, "hi", "en")
                        : transcript;

                    this.addMessage("🎤 " + transcript, "user");
                    this.messageInput.value = finalText;
                    this.sendMessage(finalText, lang);
                };

                this.recognition.onerror = (event) => {
                    console.error("Voice error:", event.error);
                };
            }

            startVoiceInput() {
                if (this.recognition) {
                    this.recognition.lang = this.languageSelect.value === "hi" ? "hi-IN" : "en-US";
                    this.recognition.start();
                }
            }

            async handleInput() {
                let message = this.messageInput.value.trim();
                if (!message) return;

                let lang = this.languageSelect.value;

                // Only translate if Hindi is selected AND text is short enough
                let translatedMessage = (lang === "hi" && message.length <= 400)
                    ? await this.translateText(message, "hi", "en")
                    : message;

                this.addMessage(message, "user");
                this.messageInput.value = '';
                this.sendMessage(translatedMessage, lang);
            }

            async sendMessage(message, lang) {
                const typingIndicator = this.showTypingIndicator();

                try {
                    const response = await fetch('/get', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({ msg: message })
                    });

                    const data = await response.json();
                    this.removeTypingIndicator(typingIndicator);

                    // ✅ If Hindi selected AND response is short, translate bot's answer back to Hindi
                    let finalAnswer = (lang === "hi" && data.answer.length <= 400)
                        ? await this.translateText(data.answer, "en", "hi")
                        : data.answer;

                    this.addMessage(finalAnswer, 'bot');

                } catch (error) {
                    this.removeTypingIndicator(typingIndicator);
                    this.addMessage("⚠️ Sorry, something went wrong. Please try again.", 'bot');
                    console.error(error);
                }
            }

            addMessage(text, sender) {
                const messageWrapper = document.createElement('div');
                messageWrapper.className = `message-wrapper ${sender}-wrapper`;

                const currentTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                messageWrapper.innerHTML = `
            <div class="avatar ${sender}-avatar">
                <i class="fas ${sender === 'user' ? 'fa-user' : 'fa-robot'}"></i>
            </div>
            <div class="message ${sender}-message">
                <div class="message-content">
                    <p>${text}</p>
                    <div class="message-time">${currentTime}</div>
                </div>
            </div>
        `;

                this.chatMessages.appendChild(messageWrapper);
                this.scrollToBottom();
            }

            showTypingIndicator() {
                const typingWrapper = document.createElement('div');
                typingWrapper.className = "message-wrapper bot-wrapper typing-indicator";

                typingWrapper.innerHTML = `
            <div class="avatar bot-avatar">
                <i class="fas fa-robot"></i>
            </div>
            <div class="message bot-message">
                <div class="message-content">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>
        `;

                this.chatMessages.appendChild(typingWrapper);
                this.scrollToBottom();
                return typingWrapper;
            }

            removeTypingIndicator(typingWrapper) {
                typingWrapper.remove();
            }

            scrollToBottom() {
                this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
            }

            async handleImageUpload(event) {
                const file = event.target.files[0];
                if (!file) return;

                // Validation
                if (!file.type.startsWith('image/')) {
                    this.addMessage("⚠️ Please upload an image file.", 'bot');
                    return;
                }

                // Show image preview in chat
                const reader = new FileReader();
                reader.onload = (e) => {
                    const imagePreview = `
                <div class="image-preview">
                    <img src="${e.target.result}" alt="Lab report" style="max-width: 100%; border-radius: 8px; margin: 10px 0;"/>
                    <p style="color: #666; font-size: 0.9em;">📄 Uploaded lab report</p>
                </div>
            `;
                    this.addMessage(imagePreview, 'user');
                };
                reader.readAsDataURL(file);

                // Show analyzing indicator
                const typingIndicator = this.showTypingIndicator();

                try {
                    // Send to backend
                    const formData = new FormData();
                    formData.append('image', file);

                    const response = await fetch('/analyze-report', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();
                    this.removeTypingIndicator(typingIndicator);

                    if (!response.ok) {
                        this.addMessage(`⚠️ Error: ${data.error || 'Failed to analyze image'}`, 'bot');
                        return;
                    }

                    // Format and display results
                    let resultHTML = `
                <div class="lab-report-result">
                    <h3 style="color: #4a90e2; margin-bottom: 10px;">📊 Lab Report Analysis</h3>
                    
                    <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; margin: 10px 0;">
                        <h4 style="color: #5bc0de; margin-bottom: 8px;">Extracted Values:</h4>
                        <pre style="white-space: pre-wrap; font-family: monospace; font-size: 0.9em; margin: 0;">${data.extracted_values}</pre>
                    </div>
                    
                    <div style="background: rgba(74, 144, 226, 0.1); padding: 15px; border-radius: 8px; margin: 10px 0;">
                        <h4 style="color: #4a90e2; margin-bottom: 8px;">Medical Explanation:</h4>
                        <p style="line-height: 1.6; margin: 0;">${data.explanation}</p>
                    </div>
                    
                    <div style="font-size: 0.8em; color: #888; margin-top: 10px;">
                        📚 Retrieved ${data.sources_count} relevant medical sources
                    </div>
                </div>
            `;

                    this.addMessage(resultHTML, 'bot');

                } catch (error) {
                    this.removeTypingIndicator(typingIndicator);
                    this.addMessage("⚠️ Error analyzing lab report. Please ensure LLaVA model is installed and try again.", 'bot');
                    console.error('Image upload error:', error);
                }

                // Reset file input
                event.target.value = '';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new MedicalChatbot();
        });
    </script>

</body>

</html>
